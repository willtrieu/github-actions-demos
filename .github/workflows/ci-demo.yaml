#initial default action to setup github action on commits to main branch
name: CI Demo

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run tests
      - run: npm tests
      
      - name: Upload Test Results
      - uses: actions/upload-artifact@v4
        with: 
          name: test-results
          path: test-results/